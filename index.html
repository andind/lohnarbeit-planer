<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lohnarbeit-Planer</title>
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lohnarbeit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" width="28" height="28">
    <span>Lohnarbeit-Planer</span>
  </div>
  <button class="sync" id="syncBtn" data-act="sync" title="Jetzt synchronisieren">
    <span class="dot" id="syncDot"></span><span id="syncText">…</span>
  </button>
  <button class="btn primary new" data-act="newOrder">＋ <span class="hide-sm">Neuer Auftrag</span></button>
</header>

<nav class="tabs" id="tabs">
  <button data-view="auftraege"><svg viewBox="0 0 24 24"><path d="M9 5h10M9 12h10M9 19h10M4 5h.01M4 12h.01M4 19h.01"/></svg><span>Aufträge</span></button>
  <button data-view="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Plan</span></button>
  <button data-view="kunden"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Kunden</span></button>
  <button data-view="maschinen"><svg viewBox="0 0 24 24"><circle cx="7" cy="17" r="3.5"/><circle cx="18" cy="18" r="2.5"/><path d="M4 13V7h7l2 6h6v5M11 7v6"/></svg><span>Maschinen</span></button>
  <button data-view="mehr"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Mehr</span></button>
</nav>

<main id="main">
  <div id="toolbar"></div>
  <div id="content"></div>
</main>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
