<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IM-Vermietung</title>
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IM-Vermietung">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon-192.png" alt="" width="28" height="28">
    <span>IM-Vermietung</span><small class="ver" id="appVer"></small>
  </div>
  <button class="sync" id="syncBtn" data-act="sync" title="Jetzt synchronisieren">
    <span class="dot" id="syncDot"></span><span id="syncText">…</span>
  </button>
  <button class="btn primary new" data-act="newEinsatz">＋ <span class="hide-sm">Einsatz</span></button>
</header>

<nav class="tabs" id="tabs">
  <button data-view="einsaetze"><svg viewBox="0 0 24 24"><path d="M9 5h10M9 12h10M9 19h10M4 5h.01M4 12h.01M4 19h.01"/></svg><span>Einsätze</span></button>
  <button data-view="import"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Import</span></button>
  <button data-view="auswertung"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Auswertung</span></button>
  <button data-view="abrechnung"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg><span>Abrechnung</span></button>
  <button data-view="stamm"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span>Stammdaten</span></button>
  <button data-view="mehr"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Mehr</span></button>
</nav>

<main id="main">
  <div id="toolbar"></div>
  <div id="content"></div>
</main>

<div id="selbar" hidden></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status"></div>
<div id="printArea"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
