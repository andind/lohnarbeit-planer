<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>IM-Feldbereinigung</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6b3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* IM-Feldbereinigung – Vorschläge zum Zusammenführen von Feldern im John Deere Operations Center (nur PC)
   Liest jd-sync.json, jd-feldgrenzen.json und jd-arbeiten.json aus dem Dropbox-App-Ordner (geschrieben vom NAS-Dienst jd-sync).
   Das Programm ändert nichts in MyJohnDeere: es schlägt doppelte und angrenzende Felder des gleichen Kunden vor,
   zusammengeführt wird von Hand im Operations Center. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#d9ddd6;
  --accent:#2f6b3f; --accent-fg:#ffffff; --accent-soft:#e3eee5; --warn:#a4421d; --warn-soft:#f7e6de; --chip:#eef0ec;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141816; --panel:#1c211e; --fg:#e7ebe6; --muted:#9aa49d; --line:#2f3732;
  --accent:#6fbf83; --accent-fg:#0f1a12; --accent-soft:#233127; --warn:#e58a63; --warn-soft:#3a251c; --chip:#262d29; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);display:flex;flex-direction:column}
header{background:var(--accent);color:var(--accent-fg);padding:10px 20px;display:flex;align-items:center;gap:18px;flex:none}
header h1{font:700 24px/1 var(--display);margin:0;letter-spacing:.3px}
header .ver{font-size:12px;opacity:.8}
header .stand{margin-left:auto;font-size:13px;text-align:right;opacity:.95}
header button{background:transparent;border:1px solid currentColor;color:inherit}
nav{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:11px 14px;font:600 15px var(--body);color:var(--muted)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{flex:1;overflow:auto;padding:16px 20px 30px}
button{font:500 14px var(--body);padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.warn{background:var(--warn);color:#fff;border-color:var(--warn);font-weight:600}
button.sm{padding:4px 9px;font-size:13px}
select,input[type=search],input[type=number]{font:14px var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.bar label{display:flex;align-items:center;gap:6px;font-size:14px}
.bar .sp{flex:1}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.note.w{border-left-color:var(--warn);background:var(--warn-soft)}
.note p{margin:4px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.card>.h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--chip)}
.card>.h b{font:600 18px/1.1 var(--display);letter-spacing:.2px}
.card>.h .sp{flex:1}
.chip{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.chip.s{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.u{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.card>.b{display:grid;grid-template-columns:1fr 250px;gap:0}
.card svg{display:block;width:250px;height:190px;border-left:1px solid var(--line);background:var(--bg)}
.card .nomap{width:250px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:10px;background:var(--bg)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 12.5px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{color:var(--muted)}
tr.sel td{background:var(--accent-soft)}
.dot{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:7px}
.keep{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.arch{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.arch input{width:17px;height:17px;accent-color:var(--accent)}
#print{display:none}
@media print{html,body{height:auto}body{display:block;background:#fff;color:#000}header,nav,main,#toast,dialog{display:none!important}#print{display:block}#print h2{font:700 17pt var(--display);margin:0 0 4pt}#print p{margin:0 0 10pt;font-size:10pt}#print table{font-size:10.5pt}#print th,#print td{border-bottom:1px solid #999;padding:5pt 6pt;vertical-align:top}#print td.k{width:22pt}#print .box{display:inline-block;width:11pt;height:11pt;border:1px solid #000}tr{break-inside:avoid}}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:0;max-width:720px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font:700 22px var(--display);margin:0;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .c{padding:14px 18px;max-height:60vh;overflow:auto}
dialog .f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;z-index:9}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.st-ok{color:var(--accent);font-weight:600}.st-f{color:var(--warn);font-weight:600}.st-w{color:var(--muted)}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:13px}
h3{font:600 18px var(--display);margin:18px 0 8px}
</style>
</head>
<body>
<header>
  <h1>IM-Feldbereinigung</h1><span class="ver" id="ver"></span>
  <div class="stand" id="stand">–</div>
  <button id="bReload" title="Stammdaten neu aus Dropbox laden">Neu laden</button>
</header>
<nav>
  <button data-tab="dup" class="on">Vorschläge <span id="nDup"></span></button>
  <button data-tab="log">Erledigt <span id="nLog"></span></button>
  <button data-tab="set">Verbindung</button>
</nav>
<main>
  <section id="tab-dup">
    <div id="hinweis"></div>
    <div class="bar">
      <label>Kunde <select id="fKunde"></select></label>
      <label>Art <select id="fArt"><option value="">Alle</option><option value="dup">Nur doppelte</option><option value="nach">Nur angrenzende</option></select></label>
      <input type="search" id="fSuch" placeholder="Feldname suchen …" size="20">
      <span class="sp"></span>
      <button id="bPrint">Liste drucken</button><button id="bCsv">Als CSV speichern</button>
    </div>
    <div class="bar">
      <label><input type="checkbox" id="oGeo" checked> Doppelt: Flächen überlappen ab <input type="number" id="oSchwelle" min="30" max="100" step="5" value="50" style="width:64px"> %</label>
      <label><input type="checkbox" id="oName" checked> Ähnliche Namen</label>
      <label title="Felder des gleichen Kunden, deren Grenzen direkt aneinander liegen"><input type="checkbox" id="oNach" checked> Angrenzende Felder, Abstand bis <input type="number" id="oTol" min="0" max="30" step="1" value="3" style="width:58px"> m</label>
      <label title="Gleiche Fläche bei zwei verschiedenen Kunden (z.B. nach Pächterwechsel)"><input type="checkbox" id="oQuer"> Doppelte auch zwischen verschiedenen Kunden</label>
    </div>
    <div id="groups"></div>
  </section>
  <section id="tab-log" hidden>
    <div class="note"><p>Als erledigt markierte Vorschläge. Nach dem nächsten Abgleich des NAS-Dienstes verschwinden im Operations Center zusammengeführte Felder ohnehin aus den Vorschlägen.</p></div>
    <div id="logList"></div>
  </section>
  <section id="tab-set" hidden>
    <div id="setBody"></div>
  </section>
</main>
<div id="print"></div>
<dialog id="dlg"><h2 id="dlgT"></h2><div class="c" id="dlgC"></div><div class="f"><button id="dlgNo">Abbrechen</button><button id="dlgOk" class="warn"></button></div></dialog>
<div id="toast"></div>

<script src="config.js"></script>
<script>
"use strict";
const VERSION = "1.1", STAND = "16.11.2026", MIN_NACHBAR = 10;   // angrenzend ab 10 m gemeinsamer Grenze
const STATE_PATH = "/feldbereinigung.json";
const DEMO = new URLSearchParams(location.search).has("demo");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const dch = d => { const t = new Date(d); return isNaN(t) ? "" : t.toLocaleDateString("de-CH", { day:"2-digit", month:"2-digit", year:"numeric" }); };
const dchT = d => { const t = new Date(d); return isNaN(t) ? "" : t.toLocaleString("de-CH", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }); };
const ha = v => v == null ? "–" : (+v).toLocaleString("de-CH", { minimumFractionDigits:2, maximumFractionDigits:2 });
let toastT = null;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 5000); }

/* ---------- Dropbox (PKCE, gleiche Dropbox-App wie die anderen IM-Programme) ---------- */
const DBX_KEY = ((window.APP_CONFIG || {}).appKey || "").trim();
const TOK = "feldber.dbx.tok", PKCE = "feldber.dbx.pkce";
const DBX = {
  configured(){ return /^[a-z0-9]{8,30}$/i.test(DBX_KEY); },
  redirectUri(){ return location.origin + location.pathname.replace(/index\.html$/, ""); },
  tokens(){
    let t = lsGet(TOK);
    // Anmeldung von IM-Applikationskarten auf diesem PC übernehmen (gleiche Adresse, gleiche Dropbox-App)
    if (!t){ const a = lsGet("appkarte.dbx.tok"); if (a && a.refresh){ t = { refresh:a.refresh, access:a.access, exp:a.exp, von:"IM-Applikationskarten" }; lsSet(TOK, t); } }
    return t;
  },
  hasSession(){ const t = this.tokens(); return !!(t && (t.refresh || t.access)); },
  b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  async login(){
    if (!this.configured()){ toast("Dropbox ist nicht eingerichtet (App-Key fehlt in config.js)."); return; }
    if (!window.crypto || !crypto.subtle){ toast("Anmeldung nur über https möglich – das Programm über seine Internetadresse öffnen."); return; }
    const verifier = this.b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = this.b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    const state = this.b64url(crypto.getRandomValues(new Uint8Array(16)));
    lsSet(PKCE, { verifier, state });
    const p = new URLSearchParams({ client_id:DBX_KEY, response_type:"code", redirect_uri:this.redirectUri(), state, code_challenge:challenge, code_challenge_method:"S256", token_access_type:"offline" });
    location.assign("https://www.dropbox.com/oauth2/authorize?" + p);
  },
  async handleRedirect(){
    const q = new URLSearchParams(location.search);
    if (!q.has("code") && !q.has("error")) return false;
    history.replaceState(null, "", this.redirectUri());
    if (q.has("error")){ toast("Dropbox-Anmeldung abgebrochen: " + (q.get("error_description") || q.get("error"))); return false; }
    const pk = lsGet(PKCE); try { localStorage.removeItem(PKCE); } catch(e){}
    if (!pk || pk.state !== q.get("state")){ toast("Dropbox-Anmeldung ungültig – bitte nochmals versuchen."); return false; }
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body:new URLSearchParams({ client_id:DBX_KEY, grant_type:"authorization_code", code:q.get("code"), redirect_uri:this.redirectUri(), code_verifier:pk.verifier }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ toast("Dropbox-Anmeldung fehlgeschlagen: " + (j.error_description || j.error || r.status)); return false; }
    try { localStorage.removeItem(TOK); } catch(e){}
    this.store(j); toast("Mit Dropbox verbunden"); return true;
  },
  store(j){ const t = lsGet(TOK) || {}; lsSet(TOK, { access:j.access_token, refresh:j.refresh_token || t.refresh, exp:Date.now() + (j.expires_in || 3600) * 1000, von:t.von }); },
  async token(){
    const t = this.tokens(); if (!t) return null;
    if (t.access && t.exp - 120000 > Date.now()) return t.access;
    if (!t.refresh) return null;
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body:new URLSearchParams({ client_id:DBX_KEY, grant_type:"refresh_token", refresh_token:t.refresh }) });
    if (r.status === 400 || r.status === 401){ try { localStorage.removeItem(TOK); } catch(e){} return null; }
    if (!r.ok) throw new Error("Dropbox nicht erreichbar (" + r.status + ")");
    const j = await r.json(); this.store(j); return j.access_token;
  },
  logout(){ try { localStorage.removeItem(TOK); } catch(e){} },
  arg(o){ return JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0")); },
  async req(url, opt){
    const t = await this.token(); if (!t){ const e = new Error("Bitte bei Dropbox anmelden"); e.auth = true; throw e; }
    opt = Object.assign({ method:"POST", cache:"no-store" }, opt); opt.headers = Object.assign({}, opt.headers, { Authorization:"Bearer " + t });
    const r = await fetch(url, opt);
    if (r.status === 401){ try { localStorage.removeItem(TOK); } catch(e){} const e = new Error("Bitte bei Dropbox anmelden"); e.auth = true; throw e; }
    return r;
  },
  async readJson(path){   // null = Datei fehlt
    const r = await this.req("https://content.dropboxapi.com/2/files/download", { headers:{ "Dropbox-API-Arg":this.arg({ path }) } });
    if (r.status === 409) return null;
    if (!r.ok) throw new Error("Dropbox: Herunterladen fehlgeschlagen (" + r.status + ")");
    return JSON.parse(await r.text() || "null");
  },
  async writeJson(path, data){
    const r = await this.req("https://content.dropboxapi.com/2/files/upload", { headers:{ "Content-Type":"application/octet-stream", "Dropbox-API-Arg":this.arg({ path, mode:"overwrite", mute:true }) }, body:JSON.stringify(data) });
    if (!r.ok) throw new Error("Dropbox: Speichern fehlgeschlagen (" + r.status + ")");
  },
  async del(path){ await this.req("https://api.dropboxapi.com/2/files/delete_v2", { headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ path }) }); }
};

/* ---------- Daten ---------- */
const D = { stamm:null, geo:null, arb:null, busy:false, fehler:"" };
// eigener Stand (Dropbox /feldbereinigung.json): ign = «nicht zusammenführen»-Paare, done = erledigte Vorschläge, ziel = gewähltes Zielfeld je Vorschlag
const S0 = () => ({ format:"feldbereinigung", v:2, ign:[], done:{}, ziel:{} });
let S = S0();
const UI = { tab:"dup", kunde:"", art:"", such:"" };
let A = null;   // Ergebnis der Analyse

async function loadAll(manual){
  if (D.busy) return;
  if (DEMO){ demoData(); analyse(); render(); return; }
  if (!DBX.hasSession()){ render(); return; }
  D.busy = true; D.fehler = ""; $("bReload").disabled = true; $("stand").textContent = "Daten werden geladen …";
  try {
    const [st, geo, arb, own] = await Promise.all([DBX.readJson("/jd-sync.json"), DBX.readJson("/jd-feldgrenzen.json"), DBX.readJson("/jd-arbeiten.json").catch(() => null), DBX.readJson(STATE_PATH).catch(() => null)]);
    if (!st || st.format !== "jd-sync" || !Array.isArray(st.fields)) throw new Error("Im Dropbox-Ordner gibt es keine jd-sync.json – läuft der NAS-Dienst?");
    D.stamm = st; D.geo = (geo && geo.format === "jd-feldgrenzen") ? geo : null; D.arb = (arb && Array.isArray(arb.operations)) ? arb : null;
    if (own && own.format === "feldbereinigung"){ S = Object.assign(S0(), own); lsSet("feldber.state", S); }
    else { const l = lsGet("feldber.state"); if (l && l.format === "feldbereinigung") S = Object.assign(S0(), l); }
    analyse();
    if (manual) toast("Stammdaten neu geladen");
  } catch(e){ console.warn(e); D.fehler = e.auth ? "Dropbox-Anmeldung abgelaufen – bitte im Reiter «Verbindung» neu anmelden." : e.message; }
  D.busy = false; $("bReload").disabled = false;
  render();
}
let saveT = null;
function saveState(){
  S.stand = new Date().toISOString(); lsSet("feldber.state", S);
  if (DEMO) return;
  clearTimeout(saveT); saveT = setTimeout(() => DBX.writeJson(STATE_PATH, S).catch(e => console.warn(e)), 800);
}

/* ---------- Analyse: doppelte Felder ---------- */
// Namen vergleichen: Gross/Klein, Umlaute (ä = ae), Satz- und Leerzeichen spielen keine Rolle
const canon = s => String(s || "").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const digits = c => (c.match(/\d+/g) || []).map(Number).join(",");
// Wörter, die zwei verschiedene Felder unterscheiden (kein Duplikat: «Moos oben» / «Moos unten»)
const TRENN = new Set("oben unten ober unter obere untere oberer unterer vorne hinten vorder hinter vordere hintere links rechts nord sued ost west n s o w gross klein grosse kleine neu alt lang kurz innen aussen mitte i ii iii iv a b c d".split(" "));
function lev(a, b){
  if (a === b) return 0; if (Math.abs(a.length - b.length) > 2) return 9;
  let p = Array.from({ length:b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++){ const c = [i]; for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j-1] + 1, p[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); p = c; }
  return p[b.length];
}
function nameRel(ca, cb){   // "gleich" | "aehnlich" | null
  const a = ca.replace(/ /g, ""), b = cb.replace(/ /g, "");
  if (!a || !b) return null;
  if (a === b) return "gleich";
  if (digits(ca) !== digits(cb)) return null;                    // «Feld 1» / «Feld 2»
  const ta = ca.split(" "), tb = cb.split(" ");
  const nurA = ta.filter(t => !tb.includes(t)), nurB = tb.filter(t => !ta.includes(t));
  if ([...nurA, ...nurB].some(t => TRENN.has(t))) return null;   // «oben» / «unten»
  const L = Math.min(a.length, b.length), d = lev(a, b);
  if ((L >= 5 && d <= 1) || (L >= 10 && d <= 2)) return "aehnlich";   // Tippfehler
  // ein Name ist im anderen ganz enthalten («Allmend» / «Allmend Pacht»)
  const [kurz, lang] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
  if (kurz.length < lang.length && kurz.every(t => lang.includes(t)) && kurz.join("").length >= 4) return "aehnlich";
  return null;
}
/* Geometrie: aktive Grenze je Feld, in Meter umgerechnet (ebene Näherung um eine gemeinsame Breite – für Überlappungen genau genug) */
function prepGeo(list, kx, ky){
  if (!Array.isArray(list)) return null;
  const g = list.find(x => x.aktiv && !x.archiviert && x.geo) || list.find(x => !x.archiviert && x.geo); if (!g) return null;
  const polys = []; let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, area = 0;
  const ringA = r => { let t = 0; for (let k = 0; k < r.length - 1; k++) t += r[k][0] * r[k+1][1] - r[k+1][0] * r[k][1]; return Math.abs(t) / 2; };
  for (const poly of g.geo){
    const rings = poly.map(r => r.map(q => [q[0] * kx, q[1] * ky])).filter(r => r.length >= 4);
    if (!rings.length) continue;
    for (const q of rings[0]){ if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
    area += ringA(rings[0]) - rings.slice(1).reduce((s, r) => s + ringA(r), 0);
    polys.push(rings);
  }
  return polys.length && area > 0 ? { polys, box:[x0, y0, x1, y1], area, name:g.name } : null;
}

function analyse(){

  const edges = [];
  const add = (a, b, e) => { if (!ign.has(pairKey(a.id, b.id))) edges.push(Object.assign({ a:a.id, b:b.id }, e)); };
  // 1) gleicher Kunde: doppelt (Fläche, Name) oder angrenzend
  const byC = new Map(); for (const f of fields){ if (!byC.has(f.client)) byC.set(f.client, []); byC.get(f.client).push(f); }

    const a = l[i], b = l[j], k = pairKey(a.id, b.id), rel = nameRel(a.c, b.c), o = (a.G && b.G) ? (PRE.ov.get(k) || 0) : null;

  if (t.id === "fKunde"){ UI.kunde = t.value; render(); }

  if (OPT.includes(t.id)){ lsSet("feldber.opt", { geo:$("oGeo").checked, name:$("oName").checked, quer:$("oQuer").checked, thr:$("oSchwelle").value, nach:$("oNach").checked, tol:$("oTol").value }); analyse(); render(); }
});
$("fSuch").addEventListener("input", e => { UI.such = e.target.value; render(); });
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab){ UI.tab = b.dataset.tab; render(); }
  else if (b.dataset.go){ UI.tab = b.dataset.go; render(); }
  else if (b.dataset.done){ const g = groupOf(b.dataset.done); if (g){ const z = zielOf(g); S.done[g.key] = { at:new Date().toISOString(), kunde:[...new Set(g.m.map(f => f.kunde))].join(" / "), ziel:z.name, felder:g.m.filter(f => f !== z).map(f => f.name) }; saveState(); analyse(); render(); toast("Als erledigt abgehakt (Reiter «Erledigt»)."); } }
  else if (b.dataset.undone){ delete S.done[b.dataset.undone]; saveState(); analyse(); render(); }
  else if (b.dataset.ign){ const g = groupOf(b.dataset.ign); if (g){ for (const e2 of g.edges) S.ign.push(pairKey(e2.a, e2.b)); S.ign = [...new Set(S.ign)]; saveState(); analyse(); render(); toast("Wird nicht mehr vorgeschlagen (rückgängig im Reiter «Verbindung»)."); } }
  else if (b.id === "bPrint") printList();
  else if (b.id === "bCsv") csvList();
  else if (b.id === "bReload"){ PRE = null; loadAll(true); }
  else if (b.id === "bLogin") DBX.login();
  else if (b.id === "bLogout"){ DBX.logout(); render(); toast("Von Dropbox abgemeldet."); }
  else if (b.id === "bSync") DBX.writeJson("/jd-sync-request.json", { at:new Date().toISOString(), von:"IM-Feldbereinigung" }).then(() => toast("Abgleich angefordert – in ein paar Minuten «Neu laden»."), err => toast("Anfordern fehlgeschlagen: " + err.message));
  else if (b.id === "bIgnReset"){ S.ign = []; saveState(); analyse(); render(); }
});
/* Vorschlagsliste zum Abarbeiten im Operations Center: drucken oder als CSV (Excel) */
function printList(){
  const vg = visGroups(); if (!vg.length) return;
  $("print").innerHTML = `<h2>Felder zusammenführen – Vorschläge</h2><p>${esc((D.stamm.org && D.stamm.org.name) || "")} · Stand MyJohnDeere ${dchT(D.stamm.stand)} · ${vg.length} Vorschläge · IM-Feldbereinigung v${VERSION}</p>
    <table><thead><tr><th></th><th>Kunde</th><th>Zielfeld (bleibt)</th><th>zusammenführen mit</th><th>Grund</th></tr></thead><tbody>` + vg.map(g => { const z = zielOf(g);
      return `<tr><td class="k"><span class="box"></span></td><td>${esc([...new Set(g.m.map(f => f.kunde))].join(" / "))}</td><td><b>${esc(z.name)}</b><br><small>${ha(z.flaeche)} ha · ${z.ops.n} Arbeitsgänge</small></td>
        <td>${g.m.filter(f => f !== z).map(f => `${esc(f.name)} <small>(${ha(f.flaeche)} ha · ${f.ops.n} Arb.${g.quer ? " · " + esc(f.kunde) : ""})</small>`).join("<br>")}</td><td>${esc(grundText(g).join(", "))}</td></tr>`; }).join("") + `</tbody></table>`;
  window.print();
}
function csvList(){
  const vg = visGroups(); if (!vg.length) return;
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`, rows = [["Nr", "Art", "Kunde", "Rolle", "Feld", "Fläche ha", "Grenzen", "Arbeitsgänge", "Letzter Arbeitsgang", "Grund"]];
  vg.forEach((g, i) => { const z = zielOf(g); for (const f of [z, ...g.m.filter(x => x !== z)]) rows.push([i + 1, g.art === "dup" ? "doppelt" : "angrenzend", f.kunde, f === z ? "Zielfeld" : "zusammenführen", f.name, f.flaeche == null ? "" : String(f.flaeche).replace(".", ","), f.grenzen.length, f.ops.n, f.ops.last ? dch(f.ops.last) : "", grundText(g).join(", ")]); });
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(q).join(";")).join("\r\n")], { type:"text/csv;charset=utf-8" }));
  a.download = `Felder-zusammenfuehren_${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- Start ---------- */
(async function start(){
  const o = lsGet("feldber.opt"); if (o){ $("oGeo").checked = o.geo !== false; $("oName").checked = o.name !== false; $("oQuer").checked = !!o.quer; if (+o.thr) $("oSchwelle").value = o.thr; $("oNach").checked = o.nach !== false; if (o.tol != null && o.tol !== "") $("oTol").value = o.tol; }
  try { if (await DBX.handleRedirect()) UI.tab = "dup"; } catch(e){ console.warn(e); }
  render(); loadAll(false);
})();
