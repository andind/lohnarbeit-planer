<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>IM-Feldbereinigung</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6b3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* IM-Feldbereinigung – doppelte Felder im John Deere Operations Center finden und archivieren (nur PC)
   Liest jd-sync.json, jd-feldgrenzen.json und jd-arbeiten.json aus dem Dropbox-App-Ordner (geschrieben vom NAS-Dienst jd-sync)
   und legt Aufträge «feld-status» in /jd-upload ab – der NAS-Dienst (ab v66) archiviert die Felder in MyJohnDeere. */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#d9ddd6;
  --accent:#2f6b3f; --accent-fg:#ffffff; --accent-soft:#e3eee5; --warn:#a4421d; --warn-soft:#f7e6de; --chip:#eef0ec;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141816; --panel:#1c211e; --fg:#e7ebe6; --muted:#9aa49d; --line:#2f3732;
  --accent:#6fbf83; --accent-fg:#0f1a12; --accent-soft:#233127; --warn:#e58a63; --warn-soft:#3a251c; --chip:#262d29; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);display:flex;flex-direction:column}
header{background:var(--accent);color:var(--accent-fg);padding:10px 20px;display:flex;align-items:center;gap:18px;flex:none}
header h1{font:700 24px/1 var(--display);margin:0;letter-spacing:.3px}
header .ver{font-size:12px;opacity:.8}
header .stand{margin-left:auto;font-size:13px;text-align:right;opacity:.95}
header button{background:transparent;border:1px solid currentColor;color:inherit}
nav{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:11px 14px;font:600 15px var(--body);color:var(--muted)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{flex:1;overflow:auto;padding:16px 20px 90px}
button{font:500 14px var(--body);padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.warn{background:var(--warn);color:#fff;border-color:var(--warn);font-weight:600}
button.sm{padding:4px 9px;font-size:13px}
select,input[type=search],input[type=number]{font:14px var(--body);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.bar label{display:flex;align-items:center;gap:6px;font-size:14px}
.bar .sp{flex:1}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.note.w{border-left-color:var(--warn);background:var(--warn-soft)}
.note p{margin:4px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.card>.h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--chip)}
.card>.h b{font:600 18px/1.1 var(--display);letter-spacing:.2px}
.card>.h .sp{flex:1}
.chip{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.chip.s{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.u{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.card>.b{display:grid;grid-template-columns:1fr 250px;gap:0}
.card svg{display:block;width:250px;height:190px;border-left:1px solid var(--line);background:var(--bg)}
.card .nomap{width:250px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:10px;background:var(--bg)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 12.5px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{color:var(--muted)}
tr.sel td{background:var(--warn-soft)}
.dot{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:7px}
.keep{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.arch{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.arch input{width:17px;height:17px;accent-color:var(--warn)}
#act{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:11px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
#act .sp{flex:1}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:0;max-width:720px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font:700 22px var(--display);margin:0;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .c{padding:14px 18px;max-height:60vh;overflow:auto}
dialog .f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;z-index:9}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.st-ok{color:var(--accent);font-weight:600}.st-f{color:var(--warn);font-weight:600}.st-w{color:var(--muted)}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:13px}
h3{font:600 18px var(--display);margin:18px 0 8px}
</style>
</head>
<body>
<header>
  <h1>IM-Feldbereinigung</h1><span class="ver" id="ver"></span>
  <div class="stand" id="stand">–</div>
  <button id="bReload" title="Stammdaten neu aus Dropbox laden">Neu laden</button>
</header>
<nav>
  <button data-tab="dup" class="on">Doppelte Felder <span id="nDup"></span></button>
  <button data-tab="log">Protokoll <span id="nLog"></span></button>
  <button data-tab="set">Verbindung</button>
</nav>
<main>
  <section id="tab-dup">
    <div id="hinweis"></div>
    <div class="bar">
      <label>Kunde <select id="fKunde"></select></label>
      <input type="search" id="fSuch" placeholder="Feldname suchen …" size="22">
      <label><input type="checkbox" id="oGeo" checked> Überlappende Flächen ab <input type="number" id="oSchwelle" min="30" max="100" step="5" value="50" style="width:64px"> %</label>
      <label><input type="checkbox" id="oName" checked> Ähnliche Namen</label>
      <label title="Gleiche Fläche bei zwei verschiedenen Kunden (z.B. nach Pächterwechsel)"><input type="checkbox" id="oQuer"> Auch zwischen verschiedenen Kunden</label>
      <span class="sp"></span>
      <button id="bSicher" title="Hakt in allen eindeutigen Gruppen die Felder ohne Arbeitsgänge an">Sichere Vorschläge anhaken</button>
    </div>
    <div id="groups"></div>
  </section>
  <section id="tab-log" hidden>
    <div class="note"><p>Archivierte Felder bleiben in MyJohnDeere erhalten (mit Grenzen und Arbeitsdaten) und lassen sich hier oder im Operations Center unter <b>Land › Archiv</b> wiederherstellen.</p></div>
    <div id="logList"></div>
  </section>
  <section id="tab-set" hidden>
    <div id="setBody"></div>
  </section>
</main>
<div id="act" hidden>
  <b id="actTxt"></b><span class="sp"></span>
  <button id="bClear">Auswahl aufheben</button>
  <button id="bArch" class="warn">Ausgewählte archivieren …</button>
</div>
<dialog id="dlg"><h2 id="dlgT"></h2><div class="c" id="dlgC"></div><div class="f"><button id="dlgNo">Abbrechen</button><button id="dlgOk" class="warn"></button></div></dialog>
<div id="toast"></div>

<script src="config.js"></script>
<script>
"use strict";
const VERSION = "1.0", STAND = "16.11.2026", NAS_MIN = 66;
const UP_DIR = "/jd-upload", STATE_PATH = "/feldbereinigung.json";
const DEMO = new URLSearchParams(location.search).has("demo");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const dch = d => { const t = new Date(d); return isNaN(t) ? "" : t.toLocaleDateString("de-CH", { day:"2-digit", month:"2-digit", year:"numeric" }); };
const dchT = d => { const t = new Date(d); return isNaN(t) ? "" : t.toLocaleString("de-CH", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }); };
const ha = v => v == null ? "–" : (+v).toLocaleString("de-CH", { minimumFractionDigits:2, maximumFractionDigits:2 });
let toastT = null;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 5000); }

/* ---------- Dropbox (PKCE, gleiche Dropbox-App wie die anderen IM-Programme) ---------- */
const DBX_KEY = ((window.APP_CONFIG || {}).appKey || "").trim();
const TOK = "feldber.dbx.tok", PKCE = "feldber.dbx.pkce";
const DBX = {
  configured(){ return /^[a-z0-9]{8,30}$/i.test(DBX_KEY); },
  redirectUri(){ return location.origin + location.pathname.replace(/index\.html$/, ""); },
  tokens(){
    let t = lsGet(TOK);
    // Anmeldung von IM-Applikationskarten auf diesem PC übernehmen (gleiche Adresse, gleiche Dropbox-App)
    if (!t){ const a = lsGet("appkarte.dbx.tok"); if (a && a.refresh){ t = { refresh:a.refresh, access:a.access, exp:a.exp, von:"IM-Applikationskarten" }; lsSet(TOK, t); } }
    return t;
  },
  hasSession(){ const t = this.tokens(); return !!(t && (t.refresh || t.access)); },
  b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  async login(){
    if (!this.configured()){ toast("Dropbox ist nicht eingerichtet (App-Key fehlt in config.js)."); return; }
    if (!window.crypto || !crypto.subtle){ toast("Anmeldung nur über https möglich – das Programm über seine Internetadresse öffnen."); return; }
    const verifier = this.b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = this.b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    const state = this.b64url(crypto.getRandomValues(new Uint8Array(16)));
    lsSet(PKCE, { verifier, state });
    const p = new URLSearchParams({ client_id:DBX_KEY, response_type:"code", redirect_uri:this.redirectUri(), state, code_challenge:challenge, code_challenge_method:"S256", token_access_type:"offline" });
    location.assign("https://www.dropbox.com/oauth2/authorize?" + p);
  },
  async handleRedirect(){
    const q = new URLSearchParams(location.search);
    if (!q.has("code") && !q.has("error")) return false;
    history.replaceState(null, "", this.redirectUri());
    if (q.has("error")){ toast("Dropbox-Anmeldung abgebrochen: " + (q.get("error_description") || q.get("error"))); return false; }
    const pk = lsGet(PKCE); try { localStorage.removeItem(PKCE); } catch(e){}
    if (!pk || pk.state !== q.get("state")){ toast("Dropbox-Anmeldung ungültig – bitte nochmals versuchen."); return false; }
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body:new URLSearchParams({ client_id:DBX_KEY, grant_type:"authorization_code", code:q.get("code"), redirect_uri:this.redirectUri(), code_verifier:pk.verifier }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ toast("Dropbox-Anmeldung fehlgeschlagen: " + (j.error_description || j.error || r.status)); return false; }
    try { localStorage.removeItem(TOK); } catch(e){}
    this.store(j); toast("Mit Dropbox verbunden"); return true;
  },
  store(j){ const t = lsGet(TOK) || {}; lsSet(TOK, { access:j.access_token, refresh:j.refresh_token || t.refresh, exp:Date.now() + (j.expires_in || 3600) * 1000, von:t.von }); },
  async token(){
    const t = this.tokens(); if (!t) return null;
    if (t.access && t.exp - 120000 > Date.now()) return t.access;
    if (!t.refresh) return null;
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body:new URLSearchParams({ client_id:DBX_KEY, grant_type:"refresh_token", refresh_token:t.refresh }) });
    if (r.status === 400 || r.status === 401){ try { localStorage.removeItem(TOK); } catch(e){} return null; }
    if (!r.ok) throw new Error("Dropbox nicht erreichbar (" + r.status + ")");
    const j = await r.json(); this.store(j); return j.access_token;
  },
  logout(){ try { localStorage.removeItem(TOK); } catch(e){} },
  arg(o){ return JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0")); },
  async req(url, opt){
    const t = await this.token(); if (!t){ const e = new Error("Bitte bei Dropbox anmelden"); e.auth = true; throw e; }
    opt = Object.assign({ method:"POST", cache:"no-store" }, opt); opt.headers = Object.assign({}, opt.headers, { Authorization:"Bearer " + t });
    const r = await fetch(url, opt);
    if (r.status === 401){ try { localStorage.removeItem(TOK); } catch(e){} const e = new Error("Bitte bei Dropbox anmelden"); e.auth = true; throw e; }
    return r;
  },
  async readJson(path){   // null = Datei fehlt
    const r = await this.req("https://content.dropboxapi.com/2/files/download", { headers:{ "Dropbox-API-Arg":this.arg({ path }) } });
    if (r.status === 409) return null;
    if (!r.ok) throw new Error("Dropbox: Herunterladen fehlgeschlagen (" + r.status + ")");
    return JSON.parse(await r.text() || "null");
  },
  async writeJson(path, data){
    const r = await this.req("https://content.dropboxapi.com/2/files/upload", { headers:{ "Content-Type":"application/octet-stream", "Dropbox-API-Arg":this.arg({ path, mode:"overwrite", mute:true }) }, body:JSON.stringify(data) });
    if (!r.ok) throw new Error("Dropbox: Speichern fehlgeschlagen (" + r.status + ")");
  },
  async del(path){ await this.req("https://api.dropboxapi.com/2/files/delete_v2", { headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ path }) }); }
};

/* ---------- Daten ---------- */
const D = { stamm:null, geo:null, arb:null, busy:false, fehler:"" };
// eigener Stand (Dropbox /feldbereinigung.json): ign = «kein Duplikat»-Paare, arch = hier archivierte Feld-IDs, log = Protokoll
let S = { format:"feldbereinigung", v:1, ign:[], arch:{}, log:[] };
const UI = { tab:"dup", sel:new Set(), kunde:"", such:"" };
let A = null;   // Ergebnis der Analyse

async function loadAll(manual){
  if (D.busy) return;
  if (DEMO){ demoData(); analyse(); render(); return; }
  if (!DBX.hasSession()){ render(); return; }
  D.busy = true; D.fehler = ""; $("bReload").disabled = true; $("stand").textContent = "Daten werden geladen …";
  try {
    const [st, geo, arb, own] = await Promise.all([DBX.readJson("/jd-sync.json"), DBX.readJson("/jd-feldgrenzen.json"), DBX.readJson("/jd-arbeiten.json").catch(() => null), DBX.readJson(STATE_PATH).catch(() => null)]);
    if (!st || st.format !== "jd-sync" || !Array.isArray(st.fields)) throw new Error("Im Dropbox-Ordner gibt es keine jd-sync.json – läuft der NAS-Dienst?");
    D.stamm = st; D.geo = (geo && geo.format === "jd-feldgrenzen") ? geo : null; D.arb = (arb && Array.isArray(arb.operations)) ? arb : null;
    if (own && own.format === "feldbereinigung"){ S = Object.assign({ ign:[], arch:{}, log:[] }, own); lsSet("feldber.state", S); }
    else { const l = lsGet("feldber.state"); if (l && l.format === "feldbereinigung") S = Object.assign({ ign:[], arch:{}, log:[] }, l); }
    analyse();
    if (manual) toast("Stammdaten neu geladen");
  } catch(e){ console.warn(e); D.fehler = e.auth ? "Dropbox-Anmeldung abgelaufen – bitte im Reiter «Verbindung» neu anmelden." : e.message; }
  D.busy = false; $("bReload").disabled = false;
  render(); pollStart(3000);
}
let saveT = null;
function saveState(){
  S.stand = new Date().toISOString(); lsSet("feldber.state", S);
  if (DEMO) return;
  clearTimeout(saveT); saveT = setTimeout(() => DBX.writeJson(STATE_PATH, S).catch(e => console.warn(e)), 800);
}

/* ---------- Analyse: doppelte Felder ---------- */
// Namen vergleichen: Gross/Klein, Umlaute (ä = ae), Satz- und Leerzeichen spielen keine Rolle
const canon = s => String(s || "").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const digits = c => (c.match(/\d+/g) || []).map(Number).join(",");
// Wörter, die zwei verschiedene Felder unterscheiden (kein Duplikat: «Moos oben» / «Moos unten»)
const TRENN = new Set("oben unten ober unter obere untere oberer unterer vorne hinten vorder hinter vordere hintere links rechts nord sued ost west n s o w gross klein grosse kleine neu alt lang kurz innen aussen mitte i ii iii iv a b c d".split(" "));
function lev(a, b){
  if (a === b) return 0; if (Math.abs(a.length - b.length) > 2) return 9;
  let p = Array.from({ length:b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++){ const c = [i]; for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j-1] + 1, p[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); p = c; }
  return p[b.length];
}
function nameRel(ca, cb){   // "gleich" | "aehnlich" | null
  const a = ca.replace(/ /g, ""), b = cb.replace(/ /g, "");
  if (!a || !b) return null;
  if (a === b) return "gleich";
  if (digits(ca) !== digits(cb)) return null;                    // «Feld 1» / «Feld 2»
  const ta = ca.split(" "), tb = cb.split(" ");
  const nurA = ta.filter(t => !tb.includes(t)), nurB = tb.filter(t => !ta.includes(t));
  if ([...nurA, ...nurB].some(t => TRENN.has(t))) return null;   // «oben» / «unten»
  const L = Math.min(a.length, b.length), d = lev(a, b);
  if ((L >= 5 && d <= 1) || (L >= 10 && d <= 2)) return "aehnlich";   // Tippfehler
  // ein Name ist im anderen ganz enthalten («Allmend» / «Allmend Pacht»)
  const [kurz, lang] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
  if (kurz.length < lang.length && kurz.every(t => lang.includes(t)) && kurz.join("").length >= 4) return "aehnlich";
  return null;
}
/* Geometrie: aktive Grenze je Feld, in Meter umgerechnet (ebene Näherung um eine gemeinsame Breite – für Überlappungen genau genug) */
function prepGeo(list, kx, ky){
  if (!Array.isArray(list)) return null;
  const g = list.find(x => x.aktiv && !x.archiviert && x.geo) || list.find(x => !x.archiviert && x.geo); if (!g) return null;
  const polys = []; let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, area = 0;
  const ringA = r => { let t = 0; for (let k = 0; k < r.length - 1; k++) t += r[k][0] * r[k+1][1] - r[k+1][0] * r[k][1]; return Math.abs(t) / 2; };
  for (const poly of g.geo){
    const rings = poly.map(r => r.map(q => [q[0] * kx, q[1] * ky])).filter(r => r.length >= 4);
    if (!rings.length) continue;
    for (const q of rings[0]){ if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
    area += ringA(rings[0]) - rings.slice(1).reduce((s, r) => s + ringA(r), 0);
    polys.push(rings);
  }
  return polys.length && area > 0 ? { polys, box:[x0, y0, x1, y1], area, name:g.name } : null;
}
function inRing(r, x, y){ let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++){ const a = r[i], b = r[j]; if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; }
function inside(G, x, y){ for (const p of G.polys){ if (inRing(p[0], x, y)){ let loch = false; for (let k = 1; k < p.length; k++) if (inRing(p[k], x, y)){ loch = true; break; } if (!loch) return true; } } return false; }
// Anteil der kleineren Fläche, der in der anderen liegt (0…1); Raster über dem gemeinsamen Rechteck
function overlap(G, H){
  const x0 = Math.max(G.box[0], H.box[0]), y0 = Math.max(G.box[1], H.box[1]), x1 = Math.min(G.box[2], H.box[2]), y1 = Math.min(G.box[3], H.box[3]);
  if (x1 <= x0 || y1 <= y0) return 0;
  const min = Math.min(G.area, H.area);
  if ((x1 - x0) * (y1 - y0) < min * 0.25) return 0;   // kann die Schwelle (mind. 30 %) nicht erreichen
  const count = N => { const dx = (x1 - x0) / N, dy = (y1 - y0) / N; let n = 0; for (let i = 0; i < N; i++){ const x = x0 + (i + .5) * dx; for (let j = 0; j < N; j++){ const y = y0 + (j + .5) * dy; if (inside(G, x, y) && inside(H, x, y)) n++; } } return n * dx * dy; };
  if (!count(10)) return 0;
  return Math.min(1, count(48) / min);
}
const pairKey = (a, b) => a < b ? a + "|" + b : b + "|" + a;
let PRE = null;   // vorbereitete Felder + Überlappungen (nur bei neuen Daten neu gerechnet)
function prepare(){
  const st = D.stamm, cName = new Map(st.clients.map(c => [c.id, c.name])), fName = new Map((st.farms || []).map(f => [f.id, f.name]));
  const ops = new Map();
  if (D.arb) for (const o of D.arb.operations){ const e = ops.get(o.field) || { n:0, last:"" }; e.n++; if (String(o.start || "") > e.last) e.last = String(o.start || ""); ops.set(o.field, e); }
  let lat0 = 47; const gf = (D.geo && D.geo.fields) || {};
  for (const k in gf){ const q = gf[k][0] && gf[k][0].geo && gf[k][0].geo[0] && gf[k][0].geo[0][0] && gf[k][0].geo[0][0][0]; if (q){ lat0 = q[1]; break; } }
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110574;
  const fields = st.fields.filter(f => !f.archived).map(f => ({ id:f.id, name:f.name, client:f.client, kunde:cName.get(f.client) || "", betrieb:fName.get(f.farm) || "", flaeche:f.flaeche,
    grenzen:(f.grenzen || []).filter(g => !g.archiviert), c:canon(f.name), G:prepGeo(gf[f.id], kx, ky), ops:ops.get(f.id) || { n:0, last:"" } }));
  // Überlappungen aller Paare mit sich berührenden Rechtecken (nach x sortiert durchlaufen)
  const ov = new Map(), mg = fields.filter(f => f.G).sort((a, b) => a.G.box[0] - b.G.box[0]);
  for (let i = 0; i < mg.length; i++) for (let j = i + 1; j < mg.length && mg[j].G.box[0] < mg[i].G.box[2]; j++){ const r = overlap(mg[i].G, mg[j].G); if (r >= 0.3) ov.set(pairKey(mg[i].id, mg[j].id), r); }
  PRE = { fields, ov, byId:new Map(fields.map(f => [f.id, f])), kx, ky };
}
function analyse(){
  if (!D.stamm){ A = null; return; }
  if (!PRE) prepare();
  const thr = Math.min(100, Math.max(30, +$("oSchwelle").value || 50)) / 100, optGeo = $("oGeo").checked, optName = $("oName").checked, quer = $("oQuer").checked;
  const ign = new Set(S.ign), fields = PRE.fields.filter(f => !S.arch[f.id]), byId = new Map(fields.map(f => [f.id, f]));
  const edges = [];
  const add = (a, b, e) => { if (!ign.has(pairKey(a.id, b.id))) edges.push(Object.assign({ a:a.id, b:b.id }, e)); };
  // 1) gleicher Kunde: Name und Fläche
  const byC = new Map(); for (const f of fields){ if (!byC.has(f.client)) byC.set(f.client, []); byC.get(f.client).push(f); }
  for (const l of byC.values()) for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++){
    const a = l[i], b = l[j], rel = nameRel(a.c, b.c), o = (a.G && b.G) ? (PRE.ov.get(pairKey(a.id, b.id)) || 0) : null;
    if (o != null){
      if (optGeo && o >= thr) add(a, b, { ov:o, rel });
      else if (rel === "gleich") add(a, b, { ov:o, rel, getrennt:o < 0.3 });      // gleicher Name, aber an verschiedenen Orten
    } else if (rel === "gleich" || (rel === "aehnlich" && optName)) add(a, b, { ov:null, rel });
  }
  // 2) verschiedene Kunden: nur über die Fläche
  if (quer && optGeo) for (const [k, o] of PRE.ov){ if (o < thr) continue; const [x, y] = k.split("|"), a = byId.get(x), b = byId.get(y); if (a && b && a.client !== b.client) add(a, b, { ov:o, rel:nameRel(a.c, b.c), quer:true }); }
  // Gruppen (zusammenhängende Felder)
  const par = new Map(); const find = x => { while (par.get(x) !== x){ par.set(x, par.get(par.get(x))); x = par.get(x); } return x; };
  for (const e of edges){ for (const x of [e.a, e.b]) if (!par.has(x)) par.set(x, x); par.set(find(e.a), find(e.b)); }
  const gm = new Map();
  for (const e of edges){ const r = find(e.a); if (!gm.has(r)) gm.set(r, { ids:new Set(), edges:[] }); const g = gm.get(r); g.ids.add(e.a); g.ids.add(e.b); g.edges.push(e); }
  const groups = [...gm.values()].map(g => {
    const m = [...g.ids].map(id => byId.get(id));
    // Vorschlag «behalten»: meiste Arbeitsgänge, dann jüngster Arbeitsgang, dann mit Grenze, dann mehr Grenzen
    m.sort((a, b) => b.ops.n - a.ops.n || b.ops.last.localeCompare(a.ops.last) || (b.G ? 1 : 0) - (a.G ? 1 : 0) || b.grenzen.length - a.grenzen.length || a.name.localeCompare(b.name, "de"));
    const stark = e => (e.ov != null && e.ov >= 0.8) || (e.rel === "gleich" && !e.getrennt && (e.ov == null || e.ov >= thr));
    const sicher = !!D.arb && m.slice(1).every(f => f.ops.n === 0 && g.edges.some(e => (e.a === f.id || e.b === f.id) && stark(e) && !e.quer));
    const maxOv = Math.max(0, ...g.edges.map(e => e.ov || 0));
    return { key:m.map(f => f.id).sort().join("+"), m, edges:g.edges, keep:m[0].id, sicher, maxOv, quer:g.edges.some(e => e.quer),
      gleich:g.edges.some(e => e.rel === "gleich"), aehnlich:g.edges.some(e => e.rel === "aehnlich"), getrennt:g.edges.every(e => e.getrennt), kunde:m[0].kunde };
  }).sort((a, b) => (b.sicher - a.sicher) || a.kunde.localeCompare(b.kunde, "de") || a.m[0].name.localeCompare(b.m[0].name, "de"));
  // Auswahl auf noch vorhandene Felder beschränken
  const vis = new Set(groups.flatMap(g => g.m.map(f => f.id))); for (const id of [...UI.sel]) if (!vis.has(id)) UI.sel.delete(id);
  A = { groups, nFields:fields.length, mitGrenze:fields.filter(f => f.G).length, thr };
}

/* ---------- Anzeige ---------- */
const FARBEN = ["#2563eb", "#d9480f", "#7c3aed", "#0f766e", "#be123c", "#a16207"], STRICH = ["", "7 4", "2 4", "10 3 2 3", "", "7 4"];
function miniMap(g){
  const mg = g.m.map((f, i) => ({ f, i })).filter(x => x.f.G);
  if (!mg.length) return `<div class="nomap">Keine Feldgrenze vorhanden –<br>Vergleich nur über den Namen</div>`;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const { f } of mg){ const b = f.G.box; x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); }
  const W = 250, H = 190, pad = 20, k = Math.min((W - 2 * pad) / Math.max(1, x1 - x0), (H - 2 * pad) / Math.max(1, y1 - y0));
  const ox = (W - (x1 - x0) * k) / 2, oy = (H - (y1 - y0) * k) / 2;
  const path = G => G.polys.map(p => p.map(r => "M" + r.map(q => (ox + (q[0] - x0) * k).toFixed(1) + " " + (H - oy - (q[1] - y0) * k).toFixed(1)).join("L") + "Z").join("")).join("");
  const m = Math.round(Math.max(x1 - x0, y1 - y0));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lage der Feldgrenzen">` + mg.map(({ f, i }) =>
    `<path d="${path(f.G)}" fill="${FARBEN[i % 6]}" fill-opacity=".13" fill-rule="evenodd" stroke="${FARBEN[i % 6]}" stroke-width="2" stroke-dasharray="${STRICH[i % 6]}"><title>${esc(f.name)}</title></path>`).join("") +
    `<text x="6" y="${H - 6}" font-size="11" fill="currentColor" opacity=".6">Ausschnitt ca. ${m} m</text></svg>`;
}
function groupHtml(g){
  const chips = [];
  if (g.sicher) chips.push(`<span class="chip s">eindeutig</span>`);
  if (g.maxOv >= 0.3) chips.push(`<span class="chip">Fläche überlappt ${Math.round(g.maxOv * 100)} %</span>`);
  if (g.gleich) chips.push(`<span class="chip">gleicher Name</span>`); else if (g.aehnlich) chips.push(`<span class="chip">ähnlicher Name</span>`);
  if (g.getrennt) chips.push(`<span class="chip u">Flächen liegen getrennt – wohl zwei Felder</span>`);
  if (g.quer) chips.push(`<span class="chip u">verschiedene Kunden</span>`);
  const kunden = [...new Set(g.m.map(f => f.kunde))].join(" / ");
  const rows = g.m.map((f, i) => {
    const sel = UI.sel.has(f.id), akt = f.grenzen.find(x => x.aktiv);
    return `<tr class="${sel ? "sel" : ""}">
      <td><label class="arch"><input type="checkbox" data-f="${esc(f.id)}" data-g="${esc(g.key)}" ${sel ? "checked" : ""}> archivieren</label></td>
      <td><span class="dot" style="border-top-color:${FARBEN[i % 6]};border-top-style:${STRICH[i % 6] ? "dashed" : "solid"}"></span><b>${esc(f.name)}</b>${f.id === g.keep ? ` <span class="keep">· Vorschlag: behalten</span>` : ""}<br><small>${esc(f.kunde)}${f.betrieb && f.betrieb !== f.kunde ? " · " + esc(f.betrieb) : ""}</small></td>
      <td class="n">${ha(f.flaeche)}</td>
      <td>${f.grenzen.length ? `${f.grenzen.length} <small>${akt ? "· aktiv: " + esc(akt.name) : "· keine aktiv"}</small>` : `<small>keine</small>`}</td>
      <td class="n">${D.arb ? (f.ops.n ? `${f.ops.n} <small>· zuletzt ${dch(f.ops.last)}</small>` : `<small>keine</small>`) : `<small>?</small>`}</td></tr>`;
  }).join("");
  return `<div class="card"><div class="h"><b>${esc(kunden)}</b>${chips.join("")}<span class="sp"></span>
    <button class="sm" data-vor="${esc(g.key)}">Vorschlag anhaken</button><button class="sm" data-ign="${esc(g.key)}" title="Diese Felder gehören nicht zusammen – nicht mehr anzeigen">Kein Duplikat</button></div>
    <div class="b"><table><thead><tr><th></th><th>Feld</th><th class="n">Fläche ha</th><th>Grenzen</th><th class="n">Arbeitsgänge</th></tr></thead><tbody>${rows}</tbody></table>${miniMap(g)}</div></div>`;
}
function visGroups(){
  if (!A) return [];
  const s = canon(UI.such);
  return A.groups.filter(g => (!UI.kunde || g.m.some(f => f.client === UI.kunde)) && (!s || g.m.some(f => f.c.includes(s))));
}
function render(){
  $("ver").textContent = `v${VERSION} · ${STAND}${DEMO ? " · BEISPIELDATEN" : ""}`;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === UI.tab));
  for (const t of ["dup", "log", "set"]) $("tab-" + t).hidden = UI.tab !== t;
  const st = D.stamm, nas = st ? parseInt(st.dienst, 10) || 0 : 0;
  $("stand").innerHTML = st ? `${esc((st.org && st.org.name) || "MyJohnDeere")} · Stand ${dchT(st.stand)}<br><small>NAS-Dienst v${esc(st.dienst || "?")}</small>` : (D.busy ? "Daten werden geladen …" : "nicht verbunden");
  // Hinweise

  if (!DEMO && !DBX.hasSession()) h.push(`<div class="note w"><p><b>Nicht mit Dropbox verbunden.</b> Die Felder kommen über den NAS-Dienst jd-sync aus dem Dropbox-Ordner. <button class="sm pri" data-go="set">Zur Anmeldung</button></p></div>`);

  if (st && !D.geo) h.push(`<div class="note w"><p>Die Datei <code>jd-feldgrenzen.json</code> fehlt – der Vergleich läuft nur über die Feldnamen.</p></div>`);
  if (st && !D.arb) h.push(`<div class="note w"><p>Die Datei <code>jd-arbeiten.json</code> fehlt – es ist nicht ersichtlich, welches Feld Arbeitsgänge hat. «Sichere Vorschläge» sind deshalb ausgeschaltet.</p></div>`);
  if (A) h.push(`<div class="note"><p><b>${A.groups.length} Gruppen</b> mit möglichen Duplikaten in ${A.nFields} aktiven Feldern (${A.mitGrenze} mit Feldgrenze)${D.arb ? ` · Arbeitsgänge gezählt seit ${dch(D.arb.seit)}` : ""}.</p>
    <p><small>Nichts wird automatisch geändert: Felder anhaken, dann «Ausgewählte archivieren». Archivierte Felder behalten Grenzen und Arbeitsdaten und lassen sich wiederherstellen. Arbeitsgänge werden dabei <b>nicht</b> auf das behaltene Feld übertragen.</small></p></div>`);
  $("hinweis").innerHTML = h.join("");
  // Kundenfilter
  if (A){
    const ks = new Map(); for (const g of A.groups) for (const f of g.m) ks.set(f.client, f.kunde);
    const opt = [...ks].sort((a, b) => a[1].localeCompare(b[1], "de"));
    if (UI.kunde && !ks.has(UI.kunde)) UI.kunde = "";
    $("fKunde").innerHTML = `<option value="">Alle Kunden (${opt.length})</option>` + opt.map(([id, n]) => `<option value="${esc(id)}" ${id === UI.kunde ? "selected" : ""}>${esc(n)}</option>`).join("");
  }
  const vg = visGroups();
  $("groups").innerHTML = !A ? "" : vg.length ? vg.map(groupHtml).join("") : `<div class="empty">${A.groups.length ? "Kein Treffer mit diesem Filter." : "Keine doppelten Felder gefunden. ✓"}</div>`;
  $("nDup").textContent = A ? `(${A.groups.length})` : "";
  $("bSicher").disabled = !A || !A.groups.some(g => g.sicher);
  if (A) $("bSicher").textContent = `Sichere Vorschläge anhaken (${A.groups.filter(g => g.sicher).length})`;
  // Aktionsleiste
  const n = UI.sel.size;
  $("act").hidden = !n || UI.tab !== "dup";
  $("actTxt").textContent = `${n} ${n === 1 ? "Feld" : "Felder"} zum Archivieren ausgewählt`;
  $("bArch").disabled = !DEMO && (!st || nas < NAS_MIN);
  renderLog(); renderSet();
}
function renderLog(){
  const l = S.log || [], w = l.filter(x => x.status === "wartet").length;
  $("nLog").textContent = l.length ? `(${w ? w + " offen / " : ""}${l.length})` : "";
  if (!l.length){ $("logList").innerHTML = `<div class="empty">Noch nichts archiviert.</div>`; return; }
  $("logList").innerHTML = `<div class="card"><table><thead><tr><th>Zeit</th><th>Feld</th><th>Kunde</th><th>Auftrag</th><th>Status</th><th></th></tr></thead><tbody>` + l.map(x => {
    const kann = x.aktion === "archivieren" && x.status === "ok" && !x.rueck;
    return `<tr><td>${dchT(x.at)}</td><td><b>${esc(x.feld)}</b></td><td>${esc(x.kunde)}</td><td>${x.aktion === "archivieren" ? "Archivieren" : "Wiederherstellen"}</td>
      <td><span class="${x.status === "ok" ? "st-ok" : x.status === "fehler" ? "st-f" : "st-w"}">${x.status === "ok" ? "✓ erledigt" : x.status === "fehler" ? "Fehler" : "wartet auf NAS-Dienst …"}</span><br><small>${esc(x.meldung || "")}</small></td>
      <td>${kann ? `<button class="sm" data-rueck="${esc(x.id)}">Wiederherstellen</button>` : x.rueck ? `<small>wiederhergestellt</small>` : ""}</td></tr>`;
  }).join("") + `</tbody></table></div>`;
}
function renderSet(){
  const t = DBX.hasSession() ? lsGet(TOK) : null, st = D.stamm;
  $("setBody").innerHTML = `
    <h3>Dropbox</h3>
    <div class="note${t ? "" : " w"}"><p>${t ? `<b>Verbunden</b>${t.von ? ` – Anmeldung von ${esc(t.von)} auf diesem PC übernommen` : ""}.` : "<b>Nicht verbunden.</b>"}</p>
      <p>${t ? `<button id="bLogout">Abmelden</button>` : `<button id="bLogin" class="pri">Mit Dropbox anmelden</button>`}</p>
      <p><small>Für die Anmeldung muss in der Dropbox App Console › Settings › Redirect URIs diese Adresse eingetragen sein: <code>${esc(DBX.redirectUri())}</code><br>
      Ist auf diesem PC bereits IM-Applikationskarten angemeldet, wird jene Anmeldung übernommen und es ist nichts einzutragen.</small></p></div>
    <h3>NAS-Dienst jd-sync</h3>
    <div class="note"><p>${st ? `Version <b>${esc(st.dienst || "?")}</b> · letzter Abgleich ${dchT(st.stand)} · ${st.fields.length} Felder, ${st.clients.length} Kunden` : "Noch keine Daten geladen."}</p>
      <p><button id="bSync" ${t ? "" : "disabled"}>Abgleich mit MyJohnDeere anfordern</button></p>
      <p><small>Aufträge werden im Dropbox-Ordner <code>${UP_DIR}</code> abgelegt; der NAS-Dienst (ab v${NAS_MIN}) führt sie innert einer Minute aus und gleicht danach die Feldliste neu ab.</small></p></div>
    <h3>Als «Kein Duplikat» markiert</h3>
    <div class="note"><p>${(S.ign || []).length} Feldpaare werden nicht mehr vorgeschlagen. <button class="sm" id="bIgnReset" ${(S.ign || []).length ? "" : "disabled"}>Alle wieder anzeigen</button></p></div>`;
}

/* ---------- Bedienung ---------- */
function confirmDlg(titel, html, okText, fn){
  $("dlgT").textContent = titel; $("dlgC").innerHTML = html; $("dlgOk").textContent = okText;
  $("dlgOk").onclick = () => { $("dlg").close(); fn(); }; $("dlgNo").onclick = () => $("dlg").close();
  $("dlg").showModal();
}
const groupOf = key => A && A.groups.find(g => g.key === key);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("input[data-f]")){
    const g = groupOf(t.dataset.g), id = t.dataset.f;
    if (t.checked){
      if (g && g.m.every(f => f.id === id || UI.sel.has(f.id))){ t.checked = false; toast("Ein Feld der Gruppe muss bleiben – sonst wären alle archiviert."); return; }
      UI.sel.add(id);
    } else UI.sel.delete(id);
    render();
  }
  if (t.id === "fKunde"){ UI.kunde = t.value; render(); }
  if (["oGeo", "oName", "oQuer", "oSchwelle"].includes(t.id)){ lsSet("feldber.opt", { geo:$("oGeo").checked, name:$("oName").checked, quer:$("oQuer").checked, thr:$("oSchwelle").value }); analyse(); render(); }
});
$("fSuch").addEventListener("input", e => { UI.such = e.target.value; const y = $("fSuch").selectionStart; render(); $("fSuch").focus(); try { $("fSuch").setSelectionRange(y, y); } catch(x){} });
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab){ UI.tab = b.dataset.tab; render(); }
  else if (b.dataset.go){ UI.tab = b.dataset.go; render(); }
  else if (b.dataset.vor){ const g = groupOf(b.dataset.vor); if (g){ for (const f of g.m) f.id === g.keep ? UI.sel.delete(f.id) : UI.sel.add(f.id); render(); } }
  else if (b.dataset.ign){ const g = groupOf(b.dataset.ign); if (g){ for (const e2 of g.edges) S.ign.push(pairKey(e2.a, e2.b)); S.ign = [...new Set(S.ign)]; saveState(); analyse(); render(); toast("Als «Kein Duplikat» gemerkt (rückgängig im Reiter «Verbindung»)."); } }
  else if (b.dataset.rueck) restore(b.dataset.rueck);
  else if (b.id === "bSicher"){ let n = 0; for (const g of A.groups) if (g.sicher) for (const f of g.m) if (f.id !== g.keep && !UI.sel.has(f.id)){ UI.sel.add(f.id); n++; } render(); toast(`${n} Felder angehakt – bitte vor dem Archivieren durchsehen.`); }
  else if (b.id === "bClear"){ UI.sel.clear(); render(); }
  else if (b.id === "bArch") archDialog();
  else if (b.id === "bReload"){ PRE = null; loadAll(true); }
  else if (b.id === "bLogin") DBX.login();
  else if (b.id === "bLogout"){ DBX.logout(); render(); toast("Von Dropbox abgemeldet."); }
  else if (b.id === "bSync") DBX.writeJson("/jd-sync-request.json", { at:new Date().toISOString(), von:"IM-Feldbereinigung" }).then(() => toast("Abgleich angefordert – in ein paar Minuten «Neu laden»."), err => toast("Anfordern fehlgeschlagen: " + err.message));
  else if (b.id === "bIgnReset"){ S.ign = []; saveState(); analyse(); render(); }
});
function archDialog(){
  const items = [];
  for (const g of A.groups){ const weg = g.m.filter(f => UI.sel.has(f.id)); if (!weg.length) continue; const bleibt = g.m.filter(f => !UI.sel.has(f.id)); for (const f of weg) items.push({ f, bleibt }); }
  if (!items.length) return;
  const mitOps = items.filter(x => x.f.ops.n).length;
  confirmDlg(`${items.length} ${items.length === 1 ? "Feld" : "Felder"} in MyJohnDeere archivieren?`,
    `<table><thead><tr><th>Wird archiviert</th><th>Kunde</th><th class="n">Arbeitsgänge</th><th>Bleibt</th></tr></thead><tbody>` +
    items.map(x => `<tr><td><b>${esc(x.f.name)}</b></td><td>${esc(x.f.kunde)}</td><td class="n">${x.f.ops.n || "–"}</td><td>${x.bleibt.map(f => esc(f.name)).join(", ")}</td></tr>`).join("") + `</tbody></table>` +
    (mitOps ? `<div class="note w" style="margin-top:12px"><p><b>${mitOps} ${mitOps === 1 ? "Feld hat" : "Felder haben"} Arbeitsgänge.</b> Sie bleiben beim archivierten Feld und erscheinen nicht beim behaltenen.</p></div>` : "") +
    `<p><small>Der NAS-Dienst archiviert die Felder innert etwa einer Minute. Wiederherstellen: Reiter «Protokoll» oder Operations Center › Land › Archiv.</small></p>`,
    "Jetzt archivieren", () => sendOrders(items.map(x => x.f), true));
}
async function sendOrders(fields, archiviert, orig){
  if (DEMO){ for (const f of fields){ S.log.unshift({ id:"demo" + Math.random().toString(36).slice(2, 8), feldId:f.id, feld:f.name, kunde:f.kunde, aktion:archiviert ? "archivieren" : "wiederherstellen", at:new Date().toISOString(), status:"ok", meldung:"Beispieldaten – nichts gesendet" }); if (archiviert) S.arch[f.id] = 1; else delete S.arch[f.id]; } UI.sel.clear(); analyse(); render(); return; }
  if (!navigator.onLine){ toast("Keine Internetverbindung."); return; }
  let n = 0;
  try {
    for (const f of fields){
      const id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      await DBX.writeJson(`${UP_DIR}/${id}.json`, { id, at:new Date().toISOString(), von:"IM-Feldbereinigung " + VERSION, orgId:(D.stamm.org && D.stamm.org.id) || null,
        art:"feld-status", feldId:f.id, feld:f.name, kunde:f.kunde, archiviert, name:`Feld «${f.name}» ${archiviert ? "archivieren" : "wiederherstellen"}` });
      S.log.unshift({ id, feldId:f.id, feld:f.name, kunde:f.kunde, aktion:archiviert ? "archivieren" : "wiederherstellen", at:new Date().toISOString(), status:"wartet", meldung:"in Dropbox abgelegt", zu:orig || undefined });
      UI.sel.delete(f.id); n++;
    }
  } catch(e){ console.warn(e); toast(e.auth ? "Dropbox-Anmeldung abgelaufen – bitte neu anmelden." : "Senden fehlgeschlagen: " + e.message); }
  S.log = S.log.slice(0, 500); saveState(); render();
  if (n){ toast(`${n} ${n === 1 ? "Auftrag" : "Aufträge"} gesendet – der NAS-Dienst führt sie in der nächsten Minute aus.`); pollStart(15000); }
}
function restore(logId){
  const x = S.log.find(l => l.id === logId); if (!x) return;
  confirmDlg("Feld wiederherstellen?", `<p>Das Feld <b>${esc(x.feld)}</b> (${esc(x.kunde)}) wird in MyJohnDeere wieder aktiv gesetzt.</p>`, "Wiederherstellen",
    () => sendOrders([{ id:x.feldId, name:x.feld, kunde:x.kunde }], false, x.id));
}
/* Rückmeldungen des NAS-Dienstes (<id>.status.json) abholen */
let pollT = null;
function pollStart(ms){ if (!pollT && !DEMO) pollT = setTimeout(poll, ms || 15000); }
async function poll(){
  pollT = null;
  const offen = (S.log || []).filter(x => x.status === "wartet"); if (!offen.length || !DBX.hasSession()) return;
  let changed = false;
  for (const x of offen){
    try {
      const r = await DBX.readJson(`${UP_DIR}/${x.id}.status.json`);
      if (r){
        x.status = r.status === "ok" ? "ok" : "fehler"; x.meldung = r.meldung || ""; changed = true;
        if (x.status === "ok"){
          if (x.aktion === "archivieren") S.arch[x.feldId] = x.at;
          else { delete S.arch[x.feldId]; const o = S.log.find(l => l.id === x.zu); if (o) o.rueck = true; }
        }
        DBX.del(`${UP_DIR}/${x.id}.status.json`).catch(() => {});
      } else if (Date.now() - Date.parse(x.at) > 30 * 60000){
        x.status = "fehler"; x.meldung = `Keine Antwort vom NAS-Dienst nach 30 Minuten – läuft jd-sync ab Version ${NAS_MIN} und ist es mit Dropbox verbunden?`; changed = true;
      }
    } catch(e){ if (e.auth) break; }
  }
  if (changed){ saveState(); analyse(); render(); const f = offen.filter(x => x.status === "fehler").length, ok = offen.filter(x => x.status === "ok").length; if (ok || f) toast(`${ok} erledigt${f ? `, ${f} mit Fehler (siehe Protokoll)` : ""}`); }
  if (S.log.some(x => x.status === "wartet")) pollStart(15000);
}

/* ---------- Start ---------- */
(async function start(){
  const o = lsGet("feldber.opt"); if (o){ $("oGeo").checked = o.geo !== false; $("oName").checked = o.name !== false; $("oQuer").checked = !!o.quer; if (+o.thr) $("oSchwelle").value = o.thr; }
  try { if (await DBX.handleRedirect()) UI.tab = "dup"; } catch(e){ console.warn(e); }
  render(); loadAll(false);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pollStart(1000); });
})();
