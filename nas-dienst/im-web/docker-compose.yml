# im-web v1.0 – Kopie aller IM-Programme auf dem NAS (Plan B, falls GitHub nicht erreichbar ist)
# Synology: Container Manager › Projekt › Erstellen › Pfad = dieser Ordner (z.B. /volume1/docker/im-web)
services:
  im-web:
    image: nginx:alpine
    container_name: im-web
    restart: unless-stopped
    ports:
      - "8788:80"            # 8787 = jd-sync, 8090 = ETA Monitor
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./programme:/usr/share/im:ro

  im-web-update:
    image: alpine/git
    container_name: im-web-update
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/skript/update.sh"]
    environment:
      - REPO=https://github.com/andind/lohnarbeit-planer.git
      - BRANCH=main
      - INTERVALL=900          # Sekunden zwischen zwei Prüfungen (15 min)
    volumes:
      - ./update.sh:/skript/update.sh:ro
      - ./programme:/programme
