# im-web v1.0 – liefert die IM-Programme unter derselben Adresse aus wie GitHub Pages: /lohnarbeit-planer/…
server {
  listen 80;
  server_name _;
  root /usr/share/im;
  charset utf-8;
  autoindex off;
  absolute_redirect off;   # Weiterleitungen relativ – der Container läuft intern auf Port 80, aussen auf 8788

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Immer beim NAS nachfragen, ob sich eine Datei geändert hat (Updates kommen sofort an)
  add_header Cache-Control "no-cache" always;

  location = / { return 302 /lohnarbeit-planer/start/; }
  location = /nas-stand.json { default_type application/json; }

  # Nicht ausliefern: Git-Daten, NAS-Dienst, Arbeitsnotizen
  location ~ /\.git { deny all; }
  location ^~ /lohnarbeit-planer/nas-dienst/ { deny all; }
  location = /lohnarbeit-planer/CLAUDE.md { deny all; }

  location ~ \.webmanifest$ {
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  location /lohnarbeit-planer/ { try_files $uri $uri/ =404; }
  location / { return 404; }
}
